name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y libgomp1
          pip install -r requirements-api.txt pytest httpx
      - name: Run tests
        run: python -m pytest -q
      - name: Build Docker image
        run: docker build -t energy-demand-api .
      - name: Publish image to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')   # GHCR needs lowercase
          IMAGE=ghcr.io/$OWNER/energy-demand-api:latest
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$OWNER" --password-stdin
          docker tag energy-demand-api "$IMAGE"
          docker push "$IMAGE"
          echo "pushed $IMAGE"
