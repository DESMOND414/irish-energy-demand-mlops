energy:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: energy.duckdb
      extensions:
        - azure
      settings:
        azure_transport_option_type: 'curl'   # use libcurl -> finds system CA certs
      secrets:
        - type: azure
          connection_string: "{{ env_var('AZURE_STORAGE_CONNECTION_STRING') }}"
